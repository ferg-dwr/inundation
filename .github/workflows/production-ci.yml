name: Production CI/CD

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'  # Only trigger release on version tags like v0.1.0, v1.2.3
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Lint with ruff
      run: |
        ruff check src/ tests/
    
    - name: Format check with black
      run: |
        black --check src/ tests/ examples/
    
    - name: Type check with mypy
      run: |
        mypy src/inundation/
    
    - name: Run unit tests
      run: |
        pytest tests/ -v -m "not integration" --cov=src/inundation --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  integration:
    # Live integration tests - run only on develop branch and tags
    # These tests hit real external services (CDEC, CNRA)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Test with real data (integration tests)
      run: |
        pytest tests/test_integration.py -v -m integration --durations=10
    
    - name: Generate coverage report
      run: |
        pytest tests/ --cov=src/inundation --cov-report=term-missing --cov-report=html
    
    - name: Upload HTML coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install bandit
      run: |
        pip install bandit
    
    - name: Run security checks
      run: |
        bandit -r src/ -ll

  release:
    # Releases ONLY trigger on version tags (e.g., v0.1.0, v1.2.3)
    # To create a release: git tag v0.1.0 && git push origin v0.1.0
    needs: [test, integration, security]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write  # Needed to create releases
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        pip install --upgrade pip build twine
    
    - name: Build distribution
      run: |
        python -m build
    
    - name: Check distribution
      run: |
        twine check dist/*
    
    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: Release ${{ steps.version.outputs.VERSION }}
        body: |
          Release ${{ steps.version.outputs.VERSION }}
          
          See [CHANGELOG.md](https://github.com/ferg-dwr/inundation/blob/main/CHANGELOG.md) for details.
          
          All tests passed and security checks completed successfully.
        draft: false
        prerelease: false
        files: dist/*
